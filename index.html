<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Užduotys">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pardavimų užduotys</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="bar" class="bar"></div>

<div id="login">
  <div class="login-box">
    <div class="logo">✓</div>
    <h1>Pardavimų užduotys</h1>
    <p class="muted">Įveskite savo PIN kodą</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="10">
    <button id="loginBtn" class="btn primary wide">Prisijungti</button>
    <p id="loginErr" class="err"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div><div class="hello" id="hello"></div><div class="muted small" id="dateLine"></div></div>
    <button class="icon hidden" id="msgBtn" title="Žinutė komandai">📣</button>
    <button class="icon hidden" id="setBtn" title="Nustatymai">⚙️</button>
    <button class="icon" id="refreshBtn" title="Atnaujinti">⟳</button>
    <button class="icon" id="logoutBtn" title="Atsijungti">🚪</button>
  </header>
  <div id="pushBar" class="pushbar hidden"></div>
  <div id="people" class="chips hidden"></div>
  <div class="tabs" id="tabs">
    <button data-tab="open" class="active">Aktyvios <span id="cntOpen"></span></button>
    <button data-tab="done">Atliktos</button>
    <button data-tab="stats" class="hidden" id="statsTab">📊</button>
  </div>
  <div id="hint" class="hint hidden">💡 Braukite užduotį į dešinę – <b>atlikta</b>, į kairę – <b>rytoj</b>. <button class="x" id="hintX">✕</button></div>
  <main id="list"><div class="empty">Kraunama…</div></main>
  <button id="fab" class="fab" title="Nauja">+</button>
</div>

<datalist id="clientList"></datalist>
<div id="sheet" class="sheet hidden"><div class="sheet-bg"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast" class="toast"><span id="toastMsg"></span><button id="toastBtn" class="hidden"></button></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="quick.js"></script>
<script src="app.js"></script>
</body>
</html>
